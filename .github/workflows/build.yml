name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Assemble Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        mkdir -p www
        cp index.html style.css www/
        cp -r js www/
        npx cap init Atmospheres com.atmospheres.player --web-dir www
        npx cap add android
        npx cap sync android

        # Разрешения на фоновое воспроизведение
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST

        # 1. Включаем флаги слияния зависимостей
        echo "android.enableJetifier=true" >> android/gradle.properties
        echo "android.useAndroidX=true" >> android/gradle.properties

        # 2. Исключаем дублирующиеся модули устаревшего Kotlin stdlib
        APP_GRADLE="android/app/build.gradle"
        cat << 'EOF' >> $APP_GRADLE

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AtmospheresApp
        path: android/app/build/outputs/apk/debug/app-debug.apk
